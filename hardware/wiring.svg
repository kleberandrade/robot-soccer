<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ROBOT-SOCCER original electrical reference</title><desc id="desc">Protected two-cell battery feeds separate five-volt motor and 3.3-volt logic regulators. ESP32-C3 controls a TB6612FNG driver. Motors connect only to driver outputs. STBY has a pulldown. Not fabrication-ready.</desc>
<rect width="1200" height="800" fill="#fafcfb"/><g font-family="Arial,sans-serif" fill="#172d35"><text x="40" y="45" font-size="25" font-weight="bold">ROBOT-SOCCER / Electrical reference v0.1</text><text x="40" y="72" font-size="14">Original design proposal • no physical validation • review schematic/layout before fabrication</text></g>
<g fill="#edf4f2" stroke="#365c59" stroke-width="2"><rect x="40" y="120" width="170" height="100" rx="8"/><rect x="260" y="120" width="230" height="100" rx="8"/><rect x="550" y="105" width="200" height="100" rx="8"/><rect x="550" y="245" width="200" height="100" rx="8"/><rect x="120" y="400" width="260" height="225" rx="8"/><rect x="650" y="400" width="260" height="225" rx="8"/><circle cx="1040" cy="450" r="43"/><circle cx="1040" cy="575" r="43"/></g>
<g font-family="Arial,sans-serif" fill="#172d35" font-size="16" text-anchor="middle"><text x="125" y="150">BAT1 / protected 2S</text><text x="125" y="176">6.4–8.4 V target</text><text x="125" y="201" font-size="12">External balance charger</text><text x="375" y="146">F1 → SW1 → reverse protection</text><text x="375" y="172">1 A fuse / accessible switch</text><text x="375" y="200" font-size="12">Per-cell protection + 6.4 V cutoff</text><text x="650" y="138">REG1 D24V10F5</text><text x="650" y="166">5 V / 1 A motor rail</text><text x="650" y="192" font-size="12">100 nF + 470 µF close to VM</text><text x="650" y="278">REG2 D24V10F3</text><text x="650" y="306">3.3 V / 1 A logic rail</text><text x="650" y="332" font-size="12">Local bypass per module datasheet</text><text x="250" y="435" font-weight="bold">ESP32-C3-MINI-1</text><text x="250" y="463" font-size="13">Custom carrier / WLAN station</text><text x="250" y="596" font-size="12">EN/BOOT/programming per Espressif</text><text x="780" y="435" font-weight="bold">TB6612FNG dual H-bridge</text><text x="780" y="460" font-size="13">VCC=3.3 V / VM=5 V</text><text x="1040" y="456">M1</text><text x="1040" y="581">M2</text><text x="1040" y="515" font-size="12">100 nF across each motor</text></g>
<g fill="none" stroke="#cf7132" stroke-width="3"><path d="M210 160 H260 M490 160 H550 M510 160 V285 H550 M750 155 H865 V400"/><path d="M750 295 H795 V385 H220 V400 M795 385 H805 V400"/></g>
<g font-family="monospace" font-size="13" fill="#9b4f20"><text x="806" y="240">5 V → VM</text><text x="398" y="375">3.3 V → module + VCC</text></g>
<g stroke="#39778a" stroke-width="2" fill="none"><path d="M380 490 H650 M380 512 H650 M380 534 H650 M380 556 H650"/><path d="M910 438 H997 M910 460 H997 M910 563 H997 M910 585 H997"/></g>
<g font-family="monospace" fill="#224c59" font-size="13" text-anchor="middle"><text x="515" y="483">GPIO 0,1 → AIN1,AIN2</text><text x="515" y="505">GPIO 3 → PWMA (20 kHz)</text><text x="515" y="527">GPIO 4,5 → BIN1,BIN2</text><text x="515" y="549">GPIO 6 → PWMB (20 kHz)</text></g>
<path d="M380 578 H620 V603 H650 M620 603 V640" fill="none" stroke="#39778a" stroke-width="2"/><path d="M620 640 l-5 5 10 8 -10 8 10 8 -5 5 V695" fill="none" stroke="#172d35" stroke-width="2"/>
<g font-family="monospace" fill="#224c59" font-size="13"><text x="440" y="596">GPIO 7 → STBY</text><text x="638" y="660">R1 10 kΩ</text><text x="638" y="678">external pulldown</text></g>
<path d="M65 695 H1120 M125 220 V695 M250 625 V695 M780 625 V695 M650 205 V226 H825 V695 M650 345 V360 H840 V695" fill="none" stroke="#172d35" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#172d35"><text x="70" y="724" font-size="14">GND star return: battery −, both regulators, MCU, driver logic GND and all PGND pins</text><text x="40" y="762" font-size="13">Never connect motors to GPIO. STBY stays LOW until a valid signed command. Cut power before rewiring. Battery/protection parts need final selection.</text></g>
</svg>
