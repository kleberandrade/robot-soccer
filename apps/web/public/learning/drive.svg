<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380"><rect width="800" height="380" rx="16" fill="#14232b"/><g font-family="Arial,sans-serif" fill="#e0eee9"><text x="30" y="42" font-size="25">Two-wheel differential drive</text><rect x="295" y="100" width="200" height="200" rx="8" fill="#33464b"/><rect x="280" y="120" width="30" height="160" rx="12" fill="#9fb6af"/><rect x="480" y="120" width="30" height="160" rx="12" fill="#9fb6af"/><path d="M295 200 H495 M395 200 V64 L383 84 M395 64 L407 84" fill="none" stroke="#a6ebbd" stroke-width="3"/><text x="370" y="185" font-size="21">L</text><text x="55" y="170" font-size="23">Left wheel: vL</text><text x="545" y="170" font-size="23">Right wheel: vR</text><text x="42" y="330" font-size="20">v = (vR + vL) / 2</text><text x="430" y="330" font-size="20">omega = (vR - vL) / L</text><text x="285" y="360" font-size="17">Top view · forward points up</text></g></svg>